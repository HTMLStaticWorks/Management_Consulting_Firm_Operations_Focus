<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="opGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="opGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <linearGradient id="opGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Background Shield Container -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#opGradDark)" stroke="rgba(59, 130, 246, 0.35)" stroke-width="2.5"/>

  <!-- Operations Precision Hexagonal Gear / Process Cycle Motif -->
  <path d="M 50 15 L 81 33 L 81 67 L 50 85 L 19 67 L 19 33 Z" fill="none" stroke="url(#opGradMain)" stroke-width="4.5" stroke-linejoin="round" />
  
  <!-- Interlocking Process Nodes -->
  <circle cx="50" cy="15" r="4" fill="url(#opGradAccent)"/>
  <circle cx="81" cy="33" r="4" fill="url(#opGradAccent)"/>
  <circle cx="81" cy="67" r="4" fill="url(#opGradAccent)"/>
  <circle cx="50" cy="85" r="4" fill="url(#opGradAccent)"/>
  <circle cx="19" cy="67" r="4" fill="url(#opGradAccent)"/>
  <circle cx="19" cy="33" r="4" fill="url(#opGradAccent)"/>

  <!-- Operations Performance Pillars -->
  <rect x="33" y="52" width="8" height="15" rx="2" fill="url(#opGradMain)" opacity="0.8"/>
  <rect x="46" y="42" width="8" height="25" rx="2" fill="url(#opGradMain)"/>
  <rect x="59" y="32" width="8" height="35" rx="2" fill="url(#opGradAccent)"/>
  
  <!-- Dynamic Operational Efficiency Trend Line & Apex Arrow -->
  <path d="M 27 58 L 42 46 L 52 51 L 71 30" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 60 30 L 71 30 L 71 41" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Apex Synergy Node -->
  <circle cx="71" cy="30" r="3" fill="#93C5FD"/>
</svg>
