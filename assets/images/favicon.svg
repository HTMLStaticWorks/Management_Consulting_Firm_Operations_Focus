<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="vanguardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vanguardChart" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#vanguardBg)" stroke="#2563EB" stroke-width="4" />
  <!-- Outer Frame / Axis -->
  <path d="M 22 76 L 78 76 M 24 76 L 24 24" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <!-- Line Chart Path (ri-line-chart-line) -->
  <path d="M 26 62 L 44 44 L 58 56 L 76 28" fill="none" stroke="url(#vanguardChart)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Upward Trend Arrowhead -->
  <path d="M 64 28 L 76 28 L 76 40" fill="none" stroke="url(#vanguardChart)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Data nodes -->
  <circle cx="44" cy="44" r="4.5" fill="#60A5FA" />
  <circle cx="58" cy="56" r="4.5" fill="#60A5FA" />
  <circle cx="76" cy="28" r="5.5" fill="#FFFFFF" />
</svg>
